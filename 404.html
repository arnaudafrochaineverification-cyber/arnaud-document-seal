<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#075b32">

  <title>Page Not Found | ARNAUD</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f6f2;
      color: #183329;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 560px;
      padding: 35px 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 25px #00000010;
    }

    .code {
      margin: 0;
      color: #08783e;
      font-size: 75px;
      font-weight: bold;
    }

    h1 {
      color: #075b32;
      font-size: 25px;
    }

    p {
      color: #617168;
      line-height: 1.7;
      font-size: 15px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    a {
      display: inline-block;
      padding: 12px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .primary {
      background: #08783e;
      color: white;
    }

    .secondary {
      background: #e6f2e9;
      color: #075b32;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #718077;
    }
  </style>
</head>

<body>

  <main class="box">

    <p class="code">404</p>

    <h1>Page Not Found</h1>

    <p>
      The page you are looking for may have moved, may have been removed,
      or may have an incorrect address.
    </p>

    <p>
      ARNAUD AFROCHAINE TRUST SYSTEMS LTD<br>
      African Roots, Global Vision.
    </p>

    <div class="links">
      <a class="primary" href="index.html">Return to Homepage</a>

      <a class="secondary" href="verify-document.html">
        Verify a Document
      </a>
    </div>

    <footer>
      &copy; <span id="year"></span>
      ARNAUD AFROCHAINE TRUST SYSTEMS LTD.
    </footer>

  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
